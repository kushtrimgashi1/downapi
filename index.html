<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaveVid V39 • Universal Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fcfcf9;
      --fg: #0a0a0a;
      --muted: #6b6b6b;
      --border: #e8e6e1;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0e;
        --fg: #f5f5f0;
        --muted: #9a9a9a;
        --border: #232323;
        --card: #161616;
      }
    }
    body {
      font-family: "Fragment Mono", monospace;
      background-color: var(--bg);
      color: var(--fg);
      margin: 0;
    }
    h1, h2, .serif { font-family: "Instrument Serif", serif; }
  </style>
</head>
<body class="min-h-screen selection:bg-black selection:text-white">

  <div class="w-full max-w-[520px] mx-auto min-h-screen flex flex-col px-5 pb-10 pt-6">
    <!-- Header -->
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-baseline gap-2">
        <h1 class="text-[28px] tracking-[-0.02em] font-normal leading-none">SaveVid</h1>
        <span class="text-[11px] px-2 py-[3px] rounded-full border border-[var(--border)] bg-black text-white dark:bg-white dark:text-black tracking-widest uppercase">V39</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-[#00d26a] animate-pulse"></span>
        <span class="text-[10px] uppercase tracking-widest text-[var(--muted)]">Pro Engine</span>
      </div>
    </header>

    <!-- Title -->
    <div class="mb-6">
      <h2 class="serif text-[40px] leading-[0.95] tracking-[-0.03em] mb-2">
        Shkarko <span class="italic">pa</span><br>watermark.
      </h2>
      <p class="text-[12px] leading-[1.5] text-[var(--muted)]">
        TikTok, Instagram Reels & Facebook (Mbështetje totale për share/r/ dhe share/v/).
      </p>
    </div>

    <!-- Input Card -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-[18px] p-[14px] shadow-[0_10px_30px_-18px_rgba(0,0,0,0.3)]">
      <div class="flex items-center gap-2 mb-3 px-1">
        <span class="text-[10px] uppercase tracking-widest text-[var(--muted)]">Linku i Videos</span>
        <div class="h-px flex-1 bg-[var(--border)]"></div>
        <button id="pasteBtn" class="text-[10px] uppercase tracking-widest underline underline-offset-4 hover:opacity-60">Ngjit (Paste)</button>
      </div>

      <div class="relative">
        <input id="urlInput" type="text" placeholder="Ngjit çdo link (FB, IG, TikTok)..." 
          class="w-full h-[54px] rounded-[12px] bg-[#f5f4ef] dark:bg-[#1e1e1e] border border-transparent focus:border-black dark:focus:border-white focus:outline-none px-4 pr-[54px] text-[13px] placeholder:text-[#b0aea8]">
        <button id="clearBtn" class="absolute right-[6px] top-[6px] bottom-[6px] w-[42px] rounded-[9px] bg-white dark:bg-black border border-[var(--border)] grid place-items-center text-[12px]">✕</button>
      </div>

      <button id="downloadBtn" class="mt-3 w-full h-[52px] rounded-[12px] bg-[var(--fg)] text-[var(--bg)] text-[13px] uppercase tracking-[0.16em] font-medium hover:opacity-[0.9] active:scale-[0.99] transition-all flex items-center justify-center gap-2">
        <span>Shkarko</span>
      </button>
    </div>

    <!-- Progress Box -->
    <div id="progressBox" class="hidden mt-5 border border-[var(--border)] rounded-[14px] bg-[var(--card)] p-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-[10px] uppercase tracking-[0.14em] text-[var(--muted)]">Progresi</span>
        <span id="progressStatus" class="text-[10px] text-[var(--muted)] animate-pulse">Duke përpunuar...</span>
      </div>
      <div id="stepsList" class="space-y-2"></div>
    </div>

    <!-- Error Box -->
    <div id="errorBox" class="hidden mt-5 rounded-[14px] border border-[#ffd1d1] bg-[#fff3f3] dark:bg-[#1f1212] dark:border-[#5a2222] p-4">
      <p id="errorText" class="text-[12px] leading-[1.5] text-[#7a1f1f] dark:text-[#ffb3b3]"></p>
    </div>

    <!-- Result Card -->
    <div id="resultBox" class="hidden mt-5 rounded-[18px] border border-[var(--border)] bg-[var(--card)] overflow-hidden shadow-[0_20px_50px_-24px_rgba(0,0,0,0.4)]">
      <div class="relative bg-black aspect-[9/12] max-h-[480px] overflow-hidden">
        <video id="videoPreview" controls playsinline class="relative w-full h-full object-contain"></video>
        <div class="absolute top-3 left-3">
          <span id="platformBadge" class="text-[10px] uppercase tracking-widest px-2 py-1 rounded-full bg-white text-black font-medium">MP4</span>
        </div>
        <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black/80 to-transparent pointer-events-none">
          <p id="videoTitle" class="text-white text-[13px] leading-[1.3] line-clamp-2"></p>
          <p id="videoAuthor" class="text-white/60 text-[11px] mt-1"></p>
        </div>
      </div>
      <div class="p-4 grid grid-cols-2 gap-3">
        <button id="dlHdBtn" class="h-[48px] rounded-[12px] bg-black text-white dark:bg-white dark:text-black grid place-items-center text-[12px] uppercase tracking-[0.12em] font-medium">
          Shkarko MP4
        </button>
        <button id="openDirectBtn" class="h-[48px] rounded-[12px] border border-[var(--border)] bg-[#f7f7f5] dark:bg-[#1e1e1e] grid place-items-center text-[12px] uppercase tracking-[0.12em] font-medium">
          Hap Video ↗
        </button>
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const stepsList = document.getElementById('stepsList');
    const progressBox = document.getElementById('progressBox');
    const progressStatus = document.getElementById('progressStatus');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const resultBox = document.getElementById('resultBox');
    const videoPreview = document.getElementById('videoPreview');
    const videoTitle = document.getElementById('videoTitle');
    const videoAuthor = document.getElementById('videoAuthor');
    const platformBadge = document.getElementById('platformBadge');
    const dlHdBtn = document.getElementById('dlHdBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentVideoData = null;

    document.getElementById('pasteBtn').onclick = async () => {
      try { urlInput.value = await navigator.clipboard.readText(); } catch (e) { urlInput.focus(); }
    };
    document.getElementById('clearBtn').onclick = () => {
      urlInput.value = '';
      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      progressBox.classList.add('hidden');
    };

    function renderSteps(steps) {
      stepsList.innerHTML = steps.map(s => `
        <div class="flex items-center justify-between text-[11px]">
          <span class="${s.status === 'pending' ? 'text-[var(--muted)]' : ''}">${s.name}</span>
          <span class="text-[10px] uppercase font-medium ${s.status === 'success' ? 'text-[#00a651]' : s.status === 'fail' ? 'text-[#ff4d4d]' : 'text-[var(--muted)]'}">
            ${s.status === 'trying' ? 'duke u përpunuar...' : s.status}
          </span>
        </div>
      `).join('');
    }

    async function fetchWithTimeout(resource, options = {}, timeout = 7000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(resource, { ...options, signal: controller.signal });
        clearTimeout(id);
        return res;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    function ensureVideoUrl(url) {
      if (!url || typeof url !== 'string') return null;
      if (url.match(/\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i)) return null;
      return url;
    }

    async function resolveShareLink(url) {
      if (!url.includes('/share/r/') && !url.includes('/share/v/')) return url;
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const res = await fetchWithTimeout(proxyUrl, {}, 6000);
        if (res.ok) {
          const finalUrl = res.url;
          if (finalUrl && !finalUrl.includes('/share/')) return finalUrl;
          const html = await res.text();
          const match = html.match(/\/reel\/(\d+)/) || html.match(/\/videos\/(\d+)/);
          if (match && match[1]) {
            return `https://www.facebook.com/reel/${match[1]}`;
          }
        }
      } catch (e) {}
      return url;
    }

    async function processVideo(url, setStep) {
      setStep(0, 'trying');
      let cleanUrl = await resolveShareLink(url);
      setStep(0, 'success');

      const isTikTok = /tiktok\.com|vm\.tiktok|vt\.tiktok/i.test(cleanUrl);

      if (isTikTok) {
        setStep(1, 'trying');
        try {
          const res = await fetchWithTimeout('https://www.tikwm.com/api/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `url=${encodeURIComponent(cleanUrl)}&hd=1`
          });
          const json = await res.json();
          const mp4 = ensureVideoUrl(json?.data?.hdplay || json?.data?.play);
          if (mp4) {
            setStep(1, 'success');
            return { hd: mp4, title: json.data.title || 'TikTok Video', author: json.data.author?.unique_id || 'tiktok', source: 'TikWM' };
          }
        } catch (e) {
          setStep(1, 'fail');
        }
      }

      // Provojmë Siputzx FBDL / AIO (Më i fuqishmi për Facebook & IG)
      setStep(isTikTok ? 2 : 1, 'trying');
      try {
        const api = `https://api.siputzx.my.id/api/d/facebook?url=${encodeURIComponent(cleanUrl)}`;
        const res = await fetchWithTimeout(api, {}, 6000);
        const json = await res.json();
        const mp4 = ensureVideoUrl(json?.data?.url || json?.url);
        if (mp4) {
          setStep(isTikTok ? 2 : 1, 'success');
          return { hd: mp4, title: json?.data?.title || 'Facebook Video', author: 'Facebook', source: 'Siputzx FB' };
        }
      } catch (e) {
        setStep(isTikTok ? 2 : 1, 'fail');
      }

      // Provojmë Ryzen FBDL API
      setStep(isTikTok ? 3 : 2, 'trying');
      try {
        const api = `https://api.ryzendesu.vip/api/downloader/fbdl?url=${encodeURIComponent(cleanUrl)}`;
        const res = await fetchWithTimeout(api, {}, 6000);
        const json = await res.json();
        const mp4 = ensureVideoUrl(json?.data?.[0]?.url || json?.url);
        if (mp4) {
          setStep(isTikTok ? 3 : 2, 'success');
          return { hd: mp4, title: 'Facebook Video', author: 'Facebook', source: 'Ryzen FBDL' };
        }
      } catch (e) {
        setStep(isTikTok ? 3 : 2, 'fail');
      }

      // Provojmë Cobalt Engine si rezervë
      setStep(isTikTok ? 4 : 3, 'trying');
      try {
        const res = await fetchWithTimeout('https://co.wuk.sh/api/json', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: cleanUrl, videoQuality: '1080' })
        });
        const json = await res.json();
        const mp4 = ensureVideoUrl(json.url || json.picker?.[0]?.url);
        if (mp4) {
          setStep(isTikTok ? 4 : 3, 'success');
          return { hd: mp4, title: json.filename || 'Social Video', author: 'Creator', source: 'Cobalt Engine' };
        }
      } catch (e) {
        setStep(isTikTok ? 4 : 3, 'fail');
      }

      throw new Error('Videoja nuk u gjet. Sigurohu që postimi në Facebook të jetë publik (Public).');
    }

    downloadBtn.onclick = async () => {
      let url = urlInput.value.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;

      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      progressBox.classList.remove('hidden');
      progressStatus.textContent = 'Duke analizuar...';
      downloadBtn.disabled = true;

      const isTikTok = /tiktok\.com|vm\.tiktok|vt\.tiktok/i.test(url);
      const steps = isTikTok
        ? [
            { name: '1. Share Link Resolver', status: 'pending' },
            { name: '2. TikWM API', status: 'pending' },
            { name: '3. Siputzx FB Engine', status: 'pending' },
            { name: '4. Ryzen FBDL', status: 'pending' },
            { name: '5. Cobalt Engine', status: 'pending' }
          ]
        : [
            { name: '1. Share Link Resolver', status: 'pending' },
            { name: '2. Siputzx FB Engine', status: 'pending' },
            { name: '3. Ryzen FBDL', status: 'pending' },
            { name: '4. Cobalt Engine', status: 'pending' }
          ];

      renderSteps(steps);
      const setStep = (idx, status) => {
        if (steps[idx]) { steps[idx].status = status; renderSteps(steps); }
      };

      try {
        const data = await processVideo(url, setStep);
        currentVideoData = data;
        progressStatus.textContent = 'U gjet!';
        videoPreview.src = data.hd;
        videoTitle.textContent = data.title;
        videoAuthor.textContent = `@${data.author} • ${data.source}`;
        platformBadge.textContent = isTikTok ? 'TIKTOK' : 'FACEBOOK';
        resultBox.classList.remove('hidden');
      } catch (err) {
        progressStatus.textContent = 'Gabim';
        errorText.textContent = err.message;
        errorBox.classList.add('hidden');
      } finally {
        downloadBtn.disabled = false;
      }
    };

    dlHdBtn.onclick = async () => {
      if (!currentVideoData?.hd) return;
      dlHdBtn.textContent = 'Duke shkarkuar...';
      try {
        const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(currentVideoData.hd)}`);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `savevid_${Date.now()}.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        dlHdBtn.textContent = '✓ U Shkarkua!';
      } catch (e) {
        window.open(currentVideoData.hd, '_blank');
        dlHdBtn.textContent = 'Shkarko MP4';
      }
    };

    document.getElementById('openDirectBtn').onclick = () => {
      if (currentVideoData?.hd) window.open(currentVideoData.hd, '_blank');
    };
  </script>
</body>
</html>
